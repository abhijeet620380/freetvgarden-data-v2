name: Update Radio Globe Data

on:
  schedule:
    - cron: "30 1,7,13,19 * * *"   # offset from TV (0,6,12,18) and radio/webcams (3,9,15,21) — never overlaps either
  workflow_dispatch: {}            # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build radio globe data
        run: node scripts/build-radio-globe-data.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add radio-globe/
          git diff --staged --quiet || git commit -m "Update radio globe data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
