name: Update Clean Channel Data

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build clean channel data
        run: node scripts/build-clean-data.mjs

      - name: Build EPG (TV guide)
        continue-on-error: true
        run: node scripts/build-epg.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add iptv/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update channel data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The radio/webcams workflows push to main while this one runs (~20 min),
          # so pull their commits in first and retry if the push is rejected.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed, retrying..."
            sleep $((attempt * 10))
          done
          exit 1
